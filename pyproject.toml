[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-ia"
version = "0.1.0"
description = "Laboratorio local de modelos de IA (Ollama + PyTorch, RTX 4050 6GB)"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
